<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batalha Naval — JogaZone</title>
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container"><a class="logo" href="../../index.html"><span class="mark">🎮</span>Joga<span class="tail">Zone</span></a></div></header>
<main class="container">
  <div class="game-page-header">
    <a class="back-link" href="../../index.html">&larr; Todos os jogos</a>
    <h1>Batalha Naval</h1>
  </div>
  <div class="game-stage">
    <div class="game-hud">
      <div>Tiros: <strong id="shots">0</strong></div>
      <div>Navios afundados: <strong id="sunk">0</strong> / 5</div>
    </div>
    <div id="board" class="naval-board"></div>
    <button class="btn" id="restart-btn">Nova batalha</button>
  </div>
  <div class="how-to-play">
    <h2>Como jogar</h2>
    <p>Clica numa célula para disparar. 🔴 significa que acertaste num navio, ⚪ significa água. Afunda os 5 navios escondidos com o menor número de tiros possível.</p>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
