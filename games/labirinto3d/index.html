<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labirinto 3D — JogaZone</title>
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container"><a class="logo" href="../../index.html"><span class="mark">🎮</span>Joga<span class="tail">Zone</span></a></div></header>
<main class="container">
  <div class="game-page-header">
    <a class="back-link" href="../../index.html">&larr; Todos os jogos</a>
    <h1>Labirinto 3D</h1>
  </div>
  <div class="game-stage">
    <div class="game-hud">
      <div>Passos: <strong id="steps">0</strong></div>
      <div id="status">Encontra a saída dourada</div>
    </div>
    <div id="scene-wrap"><canvas id="canvas"></canvas></div>
    <button class="btn" id="restart-btn">Novo labirinto</button>
  </div>
  <div class="how-to-play">
    <h2>Como jogar</h2>
    <p>Usa <strong>▲</strong> / <strong>▼</strong> (ou W/S) para andar para a frente e para trás, e <strong>◀</strong> / <strong>▶</strong> (ou A/D) para rodar. Encontra a saída brilhante antes de te perderes nos corredores.</p>
    <p style="margin-top:12px;opacity:.7;font-size:12px;">Renderizado com <a href="https://threejs.org/" target="_blank" rel="noopener">Three.js</a> (licença MIT).</p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
