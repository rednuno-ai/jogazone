<body>
<header class="site-header"><div class="container"><a class="logo" href="../../index.html"><span class="mark">🎮</span>Joga<span class="tail">Zone</span></a></div></header>
<main class="container">
  <div class="game-page-header">
    <a class="back-link" href="../../index.html">&larr; Todos os jogos</a>
    <h1>Adivinha o Número</h1>
  </div>
  <div class="game-stage">
    <div class="game-hud">
      <div>Tentativas: <strong id="tries">0</strong> / <span id="max-tries">8</span></div>
      <div>Vitórias: <strong id="wins">0</strong></div>
    </div>
    <div id="hint" class="guess-hint">Pensei num número entre 1 e 100. Adivinha!</div>
    <form id="guess-form" class="guess-form">
      <input id="guess-input" type="number" min="1" max="100" placeholder="O teu palpite" required>
      <button class="btn" type="submit">Adivinhar</button>
    </form>
    <button class="btn secondary" id="restart-btn">Novo número</button>
  </div>
  <div class="how-to-play">
    <h2>Como jogar</h2>
    <p>Escreve um número entre 1 e 100. Depois de cada palpite dizemos se o número secreto é maior ou menor. Tens 8 tentativas para acertar.</p>
  </div>
</main>
<script src="script.js"></script>
