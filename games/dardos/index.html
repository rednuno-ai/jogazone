<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dardos — JogaZone</title>
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container"><a class="logo" href="../../index.html"><span class="mark">🎮</span>Joga<span class="tail">Zone</span></a></div></header>
<main class="container">
  <div class="game-page-header">
    <a class="back-link" href="../../index.html">&larr; Todos os jogos</a>
    <h1>Dardos</h1>
  </div>
  <div class="game-stage">
    <div class="game-hud">
      <div>Dardo: <strong id="dart-num">1</strong> / 6</div>
      <div>Pontos: <strong id="score">0</strong></div>
      <div>Melhor: <strong id="best">0</strong></div>
    </div>
    <canvas id="canvas"></canvas>
    <button class="btn" id="restart-btn">Novo jogo</button>
  </div>
  <div class="how-to-play">
    <h2>Como jogar</h2>
    <p>O alvo balança sozinho. Clica no momento certo para acertares o mais perto possível do centro. Tens 6 dardos — soma a maior pontuação possível.</p>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
