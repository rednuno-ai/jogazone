<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku 6x6 — JogaZone</title>
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container"><a class="logo" href="../../index.html"><span class="mark">🎮</span>Joga<span class="tail">Zone</span></a></div></header>
<main class="container">
  <div class="game-page-header">
    <a class="back-link" href="../../index.html">&larr; Todos os jogos</a>
    <h1>Sudoku 6x6</h1>
  </div>
  <div class="game-stage">
    <div class="game-hud">
      <div id="status">Preenche a grelha sem repetir números na linha, coluna ou caixa.</div>
    </div>
    <div id="board" class="sudoku-board"></div>
    <div id="numpad" class="sudoku-numpad"></div>
    <button class="btn" id="restart-btn">Novo puzzle</button>
  </div>
  <div class="how-to-play">
    <h2>Como jogar</h2>
    <p>Clica numa célula vazia e depois num número de 1 a 6. Cada linha, coluna e caixa de 2x3 deve conter todos os números de 1 a 6 sem repetir.</p>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
