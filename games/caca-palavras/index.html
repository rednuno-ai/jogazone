<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caça-Palavras — JogaZone</title>
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container"><a class="logo" href="../../index.html"><span class="mark">🎮</span>Joga<span class="tail">Zone</span></a></div></header>
<main class="container">
  <div class="game-page-header">
    <a class="back-link" href="../../index.html">&larr; Todos os jogos</a>
    <h1>Caça-Palavras</h1>
  </div>
  <div class="game-stage">
    <div class="game-hud">
      <div>Encontradas: <strong id="found">0</strong> / <span id="total">8</span></div>
    </div>
    <div style="display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:flex-start;">
      <div id="board" class="wordsearch-board"></div>
      <ul id="word-list" class="word-list"></ul>
    </div>
    <button class="btn" id="restart-btn">Novo puzzle</button>
  </div>
  <div class="how-to-play">
    <h2>Como jogar</h2>
    <p>Clica na primeira letra de uma palavra da lista e depois na última letra (na horizontal, vertical ou diagonal) para a marcares como encontrada.</p>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
