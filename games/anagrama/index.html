<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anagrama — JogaZone</title>
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container"><a class="logo" href="../../index.html"><span class="mark">🎮</span>Joga<span class="tail">Zone</span></a></div></header>
<main class="container">
  <div class="game-page-header">
    <a class="back-link" href="../../index.html">&larr; Todos os jogos</a>
    <h1>Anagrama</h1>
  </div>
  <div class="game-stage">
    <div class="game-hud">
      <div>Pontos: <strong id="score">0</strong></div>
      <div>Categoria: <strong id="category">—</strong></div>
    </div>
    <div id="scrambled" class="anagram-letters"></div>
    <form id="guess-form" class="guess-form">
      <input id="guess-input" type="text" placeholder="A tua resposta" autocomplete="off" required>
      <button class="btn" type="submit">Verificar</button>
    </form>
    <div id="feedback" class="anagram-feedback"></div>
    <button class="btn secondary" id="skip-btn">Saltar palavra</button>
  </div>
  <div class="how-to-play">
    <h2>Como jogar</h2>
    <p>As letras da palavra estão desordenadas. Descobre a palavra original e escreve-a na caixa de texto.</p>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
