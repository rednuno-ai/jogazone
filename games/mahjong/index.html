<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahjong Solitário — JogaZone</title>
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container"><a class="logo" href="../../index.html"><span class="mark">🎮</span>Joga<span class="tail">Zone</span></a></div></header>
<main class="container">
  <div class="game-page-header">
    <a class="back-link" href="../../index.html">&larr; Todos os jogos</a>
    <h1>Mahjong Solitário</h1>
  </div>
  <div class="game-stage">
    <div class="game-hud">
      <div>Pares restantes: <strong id="pairs-left">24</strong></div>
      <div id="status"></div>
    </div>
    <div id="board" class="mj-board"></div>
    <button class="btn" id="restart-btn">Novo jogo</button>
  </div>
  <div class="how-to-play">
    <h2>Como jogar</h2>
    <p>Clica em duas peças iguais e <strong>livres</strong> (sem nada por cima e com pelo menos um lado, esquerdo ou direito, aberto) para as removeres. Remove todos os pares para venceres.</p>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
