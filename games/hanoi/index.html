<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torres de Hanói — JogaZone</title>
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container"><a class="logo" href="../../index.html"><span class="mark">🎮</span>Joga<span class="tail">Zone</span></a></div></header>
<main class="container">
  <div class="game-page-header">
    <a class="back-link" href="../../index.html">&larr; Todos os jogos</a>
    <h1>Torres de Hanói</h1>
  </div>
  <div class="game-stage">
    <div class="game-hud">
      <div>Movimentos: <strong id="moves">0</strong></div>
      <div>Mínimo possível: <strong id="minmoves">15</strong></div>
    </div>
    <div id="towers" class="hanoi-towers"></div>
    <button class="btn" id="restart-btn">Reiniciar</button>
  </div>
  <div class="how-to-play">
    <h2>Como jogar</h2>
    <p>Clica numa torre para pegares no disco do topo, depois clica noutra torre para o largares lá. Só podes pôr um disco maior por cima de um menor nunca. Move todos os discos para a última torre.</p>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
