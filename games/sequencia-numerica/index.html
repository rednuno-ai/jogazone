<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sequência Numérica — JogaZone</title>
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container"><a class="logo" href="../../index.html"><span class="mark">🎮</span>Joga<span class="tail">Zone</span></a></div></header>
<main class="container">
  <div class="game-page-header">
    <a class="back-link" href="../../index.html">&larr; Todos os jogos</a>
    <h1>Sequência Numérica</h1>
  </div>
  <div class="game-stage">
    <div class="game-hud">
      <div>Ronda: <strong id="round">0</strong></div>
      <div>Melhor: <strong id="best">0</strong></div>
    </div>
    <div id="status">Prime "Começar" e memoriza a ordem dos números.</div>
    <div id="pad" class="num-pad"></div>
    <button class="btn" id="start-btn">Começar</button>
  </div>
  <div class="how-to-play">
    <h2>Como jogar</h2>
    <p>Observa a ordem em que os números se acendem e repete-a clicando nos mesmos números pela mesma ordem. A sequência cresce uma posição a cada ronda.</p>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
