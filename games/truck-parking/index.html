<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck Parking Pro — JogaZone</title>
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container"><a class="logo" href="../../index.html"><span class="mark">🎮</span>Joga<span class="tail">Zone</span></a></div></header>
<main class="container">
  <div class="game-page-header">
    <a class="back-link" href="../../index.html">&larr; Todos os jogos</a>
    <h1>Truck Parking Pro</h1>
  </div>
  <div class="game-stage">
    <div class="game-hud">
      <div>Nível: <strong id="level">1</strong></div>
      <div>Colisões: <strong id="hits">0</strong></div>
      <div id="status">Estaciona dentro da zona verde</div>
    </div>
    <canvas id="canvas"></canvas>
    <button class="btn" id="restart-btn">Recomeçar nível</button>
  </div>
  <div class="how-to-play">
    <h2>Como jogar</h2>
    <p>Usa <strong>▲</strong> / <strong>▼</strong> para avançar/recuar e <strong>◀</strong> / <strong>▶</strong> para virar. Manobra o camião com cuidado, evita os cones e estaciona dentro da zona demarcada.</p>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
