<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Rápido — JogaZone</title>
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../truck-quiz/style.css">
</head>
<body>
<header class="site-header"><div class="container"><a class="logo" href="../../index.html"><span class="mark">🎮</span>Joga<span class="tail">Zone</span></a></div></header>
<main class="container">
  <div class="game-page-header">
    <a class="back-link" href="../../index.html">&larr; Todos os jogos</a>
    <h1>Quiz Rápido</h1>
  </div>
  <div class="game-stage">
    <div class="game-hud">
      <div>Pergunta: <strong id="qnum">1</strong> / <span id="qtotal">10</span></div>
      <div>Acertos: <strong id="correct">0</strong></div>
    </div>
    <div id="quiz-box">
      <p id="question"></p>
      <div id="options"></div>
    </div>
    <button class="btn" id="next-btn" style="display:none;">Próxima</button>
  </div>
  <div class="how-to-play">
    <h2>Como jogar</h2>
    <p>10 perguntas de cultura geral: geografia, ciência, história e curiosidades. Escolhe a resposta certa.</p>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
